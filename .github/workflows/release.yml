name: release

# Pushing a tag like v0.1.0 builds the app and attaches dist/GhosttyBar-<version>.zip to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - run: STRICT=1 make zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/GhosttyBar-$(cat VERSION).zip" --title "$GITHUB_REF_NAME" --generate-notes
